server {
    if ($host = www.autosapience.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = autosapience.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name autosapience.com www.autosapience.com;

    return 301 https://autosapience.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autosapience.com www.autosapience.com;

    if ($host = www.autosapience.com) {
        return 301 https://autosapience.com$request_uri;
    }

    root /var/www/autosapience;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # Serve static Next.js export
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/autosapience.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autosapience.com/privkey.pem; # managed by Certbot
}
